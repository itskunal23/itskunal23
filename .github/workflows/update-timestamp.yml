name: Update Last Updated Timestamp

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-timestamp:
    name: Update Last Updated in README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readme = fs.readFileSync('README.md', 'utf8');

            const now = new Date();
            const options = {
              year: 'numeric',
              month: 'short',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit',
              timeZone: 'America/New_York',
              timeZoneName: 'short'
            };
            const timestamp = now.toLocaleDateString('en-US', options);

            const newReadme = readme.replace(
              /<!--START_SECTION:last_updated-->[\s\S]*?<!--END_SECTION:last_updated-->/,
              `<!--START_SECTION:last_updated-->${timestamp}<!--END_SECTION:last_updated-->`
            );

            fs.writeFileSync('README.md', newReadme);

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update last updated timestamp [skip ci]"
          git push