name: Update WakaTime Stats

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime Stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch WakaTime stats
        id: wakatime
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: false
          SHOW_TIME: true
          SHOW_TOTAL: true
          SHOW_MASKED_TIME: false
          BLOCKS: █░
          TIME_RANGE: last_7_days
          LANG_COUNT: 6
          COMMIT_MESSAGE: "chore: update wakatime stats [skip ci]"

      - name: Update README with custom formatting
        if: steps.wakatime.outputs.waka_data != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readme = fs.readFileSync('README.md', 'utf8');

            const wakaData = `${{ steps.wakatime.outputs.waka_data }}`;
            const newReadme = readme.replace(
              /<!--START_SECTION:waka-->[\s\S]*?<!--END_SECTION:waka-->/,
              `<!--START_SECTION:waka-->\n<details>\n<summary><b>⏱️ Coding Activity (Last 7 Days)</b></summary>\n\n\`\`\`text\n${wakaData}\n\`\`\`\n\n</details>\n<!--END_SECTION:waka-->`
            );

            fs.writeFileSync('README.md', newReadme);

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update wakatime stats [skip ci]"
          git push